syntax = "proto3";

package asgt.type;

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/type;asgttype";

// Evaluation metrics of a model for one target.
message TargetMetrics {
  // Evaluation results at one confidence threshold.
  message Metric {
    reserved 11;
    // Precision of the answers at this threshold: the share of them that were correct.
    float precision = 1;
    // The confidence threshold these results apply to.
    float confidence = 2;
    // Share of the evaluation examples that got an answer at this threshold.
    float answer_rate = 3;
    // Number of true positives.
    int32 true_positive = 4;
    // Number of true negatives.
    int32 true_negative = 5;
    // Number of false positives.
    int32 false_positive = 6;
    // Number of false negatives.
    int32 false_negative = 7;
    // Matthews correlation coefficient.
    float mcc = 8;
    // Accuracy.
    float accuracy = 9;
    // Balanced accuracy.
    float balanced_accuracy = 10;
    // Epsilon of the precision bound.
    float precision_bound_epsilon = 12;
  }

  // Name of the target.
  string target = 1;
  // Results at different confidence thresholds.
  repeated Metric metrics = 2;
  reserved 3, 4, 5;

  // Entropy of the dataset.
  optional float entropy = 6;

  // Number of classes in the dataset.
  optional int32 number_of_classes = 7;

  // Average number of examples per class.
  optional float avg_sample_per_class = 8;

  // Ratio of inconsistent labels.
  optional float inconsistent_label_ratio = 9;

  // Average number of labels per inconsistent example.
  optional float avg_labels_per_inconsistent_sample = 10;

  // Percentage of examples whose value isn't in the target's vocabulary.
  optional float percent_samples_not_in_target_vocab = 11;

  // Jensen-Shannon divergence of the classes.
  optional float js_divergence_classes = 12;

  // Number of training examples with a value for this target.
  optional int32 target_train_size = 13;

  // Number of test or validation examples with a value for this target.
  optional int32 target_test_size = 14;
}
