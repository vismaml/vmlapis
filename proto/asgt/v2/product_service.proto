syntax = "proto3";

package asgt.v2;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/v2";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Product Types"
    version: "v2"
    description:
      "Product Types classifies free-text descriptions, such as invoice lines or bank transactions, "
      "into 74 standardized product types, and returns ranked candidates with confidence scores.\n\n"
      "**Hosts:** `api.prod.asgt.visma.ai` for production and `api.stag.asgt.visma.ai` for staging.\n\n"
      "**Authentication:** send your project token as `Authorization: Bearer <token>`. "
      "See [Authentication](https://docs.vml.visma.ai/authentication/).\n\n"
      "**Errors:** a failed call returns an HTTP error status with a JSON body that holds `code`, `message` and `details`.\n\n"
      "**Guides:** [Product Types](https://docs.vml.visma.ai/producttypes/getting-started/) and "
      "[limits and rate limits](https://docs.vml.visma.ai/rate-limit/)."
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Your project token, sent as `Bearer <token>`."
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

service ProductTypeService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Suggest product types from text descriptions."};

  // Suggest product types for a batch of texts.
  //
  // Returns one suggestion per text, in the same order, each with ranked product type
  // candidates. Send 1 to 512 texts, none of them empty.
  rpc BatchSuggest(ProductTypeBatchSuggestRequest) returns (ProductTypeBatchSuggestResponse) {
    option (google.api.http) = {
      post: "/v2/models/product-types:batchSuggest"
      body: "*"
    };
  }

  // Internal cluster-only batch suggest for product types.
  rpc InternalBatchSuggest(ProductTypeBatchSuggestRequest) returns (ProductTypeBatchSuggestResponse) {}

  // Internal cluster-only batch suggest that additionally returns the raw per-class model logits.
  rpc InternalBatchSuggestWithLogits(ProductTypeBatchSuggestRequest) returns (InternalProductTypeBatchSuggestResponse) {}

  // Send the correct product types for texts.
  //
  // Stores each text with its correct product type and the model's current candidates for it,
  // to evaluate the model. Returns 400 if texts is empty, if texts and trueCategories differ in
  // length, or if a category isn't a ProductType name.
  rpc Feedback(ProductTypeFeedbackRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/models/product-types:feedback"
      body: "*"
    };
  }
}

// Request body for POST /v2/models/product-types:batchSuggest.
message ProductTypeBatchSuggestRequest {
  // Texts to classify, such as invoice lines or bank transaction descriptions. Send 1 to 512
  // texts, none of them empty.
  repeated string texts = 1 [(validate.rules).repeated = {
    min_items: 1
    max_items: 512
    items: {
      string: {min_len: 1}
    }
  }];
}

// Product type suggestions for a batch of texts.
message ProductTypeBatchSuggestResponse {
  // One suggestion per text, in the same order as the request.
  repeated ProductTypeSuggestion suggestions = 1;
}

// Response of an internal method that isn't available over HTTP.
message InternalProductTypeBatchSuggestResponse {
  // One suggestion per text, in the same order as the request.
  repeated ProductTypeSuggestion suggestions = 1;
  // The model's raw scores for each text, in the same order.
  repeated ProductTypeLogits logits = 2;
}

// The model's raw scores for one text, one per class. Only returned by an internal method.
message ProductTypeLogits {
  // The scores.
  repeated float values = 1;
}

// Product type candidates for one text.
message ProductTypeSuggestion {
  reserved 1; // reserved for potential ID for reference
  // The candidates, ranked by the model.
  repeated ProductTypeCandidate candidates = 2;
}

// A product type candidate for a text.
message ProductTypeCandidate {
  // The product type, such as ACCOUNTING_SOFTWARE. It's left out when the model returns a
  // label that has no product type.
  ProductType type = 1;
  // The product type's name in words, such as "Accounting software".
  string label = 2;
  // The model's confidence score for this candidate. Use confidenceLevel to decide whether to
  // trust it.
  float confidence = 3;
  ConfidenceLevel confidence_level = 4;
}

// The product types a text can be classified into. UNDEFINED isn't a product type: it's the
// empty value.
enum ProductType {
  UNDEFINED = 0;
  ACCOUNTING_AUDIT = 1;
  ACCOUNTING_SOFTWARE = 2;
  ADVERTISING = 3;
  ALCOHOL_TOBACCO = 4;
  MEDICAL_LAB_EQUIPMENT = 5;
  BANKING_INVESTMENT = 6;
  BOOKS = 7;
  BUSINESS_CONSULTING = 8;
  CHEMICALS = 9;
  CLEANING_SERVICES = 10;
  CLEANING_SUPPLIES = 11;
  CLOTHING = 12;
  ELECTRONICS = 13;
  CONSTRUCTION_MATERIALS = 14;
  DECORATIONS_ART = 15;
  DEFENSE_SECURITY = 16;
  DEPOSITS = 17;
  DOMESTIC_APPLIANCES = 18;
  EDUCATION_TRAINING = 19;
  ENERGY = 20;
  FACILITY_MAINTENANCE = 21;
  AGRICULTURE = 22;
  FEES = 23;
  FINES = 24;
  FOOD_BEVERAGES = 25;
  FUEL_LUBRICANTS = 26;
  FURNITURE = 27;
  GIFTS = 28;
  GLASS_CERAMICS = 29;
  GOVERNMENT_SERVICES = 30;
  GRAPHIC_DESIGN = 31;
  FITNESS_CLUBS = 32;
  HEALTHCARE = 33;
  HOTELS = 34;
  INDUSTRIAL_MACHINERY = 35;
  MANUFACTURING = 36;
  INSURANCE = 37;
  INTERNET_MEDIA = 38;
  PROPERTY_RENTAL = 39;
  LEGAL = 40;
  PLANTS_ANIMALS = 41;
  MACHINERY_LEASING = 42;
  MARKETING = 43;
  MEETINGS = 44;
  MUSIC = 45;
  OFFICE_SUPPLIES = 46;
  PACKAGING = 47;
  PARKING = 48;
  PASSENGER_TRANSPORT = 49;
  PAYMENTS = 50;
  PAYROLL = 51;
  PERSONAL_SERVICES = 52;
  PERSONAL_CARE = 53;
  PHARMACEUTICALS = 54;
  MEDIA_SERVICES = 55;
  RECREATIONAL_SERVICES = 56;
  RESEARCH_TECH_CONSULTING = 57;
  RESTAURANTS = 58;
  RETIREMENT = 59;
  LOGISTICS = 60;
  SOFTWARE = 61;
  SPORTS_EQUIPMENT = 62;
  STORAGE = 63;
  TAXATION = 64;
  TELEPHONY = 65;
  TEXTILES = 66;
  JEWELRY = 67;
  TOLLS = 68;
  TOYS = 69;
  TRADE_REPAIR = 70;
  VEHICLE_RENTALS = 71;
  VEHICLES = 72;
  WATER_WASTE = 73;
  WEBSITE = 74;
}

// Request body for POST /v2/models/product-types:feedback.
message ProductTypeFeedbackRequest {
  // The texts, such as invoice lines or bank transaction descriptions. At least one is
  // required.
  repeated string texts = 1 [(validate.rules).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  // The correct product type for each text, in the same order as texts, as a ProductType name
  // such as ACCOUNTING_SOFTWARE.
  repeated string true_categories = 2 [(validate.rules).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
}

// Confidence level of a product type candidate, from VERY_LOW to VERY_HIGH. UNKNOWN means the
// model gave no level.
enum ConfidenceLevel {
  UNKNOWN = 0;
  VERY_LOW = 1;
  LOW = 2;
  MID = 3;
  HIGH = 4;
  VERY_HIGH = 5;
}
