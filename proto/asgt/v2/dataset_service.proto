syntax = "proto3";

package asgt.v2;

import "asgt/type/dataset.proto";
import "asgt/type/retention_policy.proto";
import "asgt/v2/type/example.proto";
import "asgt/v2/type/model.proto";
import "asgt/v2/type/training.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/v2";

service DatasetService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Manage datasets and the examples Autosuggest trains on."};

  // Get a dataset.
  //
  // Returns the dataset's name, type, tags, retention policy and timestamps.
  // Returns 404 if the dataset doesn't exist or has been deleted.
  rpc GetDataset(GetDatasetRequest) returns (asgt.type.Dataset) {
    option (google.api.http) = {get: "/v2/datasets/{dataset_name}"};
  }

  // Create a dataset.
  //
  // The dataset starts empty. The first example you add sets its type, and adding examples
  // schedules a training, so no model exists until you add examples and the training is done.
  // Returns 409 if a dataset with this name already exists. You can reuse the name of a deleted
  // dataset, but the new dataset keeps the deleted one's tags and retention policy.
  // Returns 400 if the name or a tag doesn't match the allowed format.
  rpc CreateDataset(CreateDatasetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/datasets"
      body: "*"
    };
  }

  // [NOT IMPLEMENTED] Create or update a dataset.
  //
  // Returns 501. Create datasets with POST /v2/datasets.
  rpc CreateOrUpdateDataset(CreateOrUpdateDatasetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {put: "/v2/datasets/{dataset_name}"};
  }

  // Delete a dataset.
  //
  // Deletes the dataset and its examples, and returns the deleted dataset. The call returns as
  // soon as the deletion is accepted, and the examples are removed shortly afterwards.
  // Returns 404 if the dataset doesn't exist or is already deleted.
  rpc DeleteDataset(DeleteDatasetRequest) returns (asgt.type.Dataset) {
    option (google.api.http) = {delete: "/v2/datasets/{dataset_name}"};
  }

  // Delete all datasets with a tag.
  //
  // Deletes every one of your datasets that has the tag, with their examples. Dataset names
  // don't matter, only the tag. The examples are removed shortly after the call returns.
  // Returns 200 even if no dataset has the tag.
  rpc DeleteTag(DeleteTagRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/tags/{tag_name}"};
  }

  // Add an example to a dataset.
  //
  // The first example sets the dataset's type, and every later example must use the same data
  // structure. Adding examples schedules a training: about a minute later while the dataset is
  // less than an hour old, otherwise 24 hours later in production and within minutes on staging.
  // Examples added while a training is scheduled or running are picked up by the next training.
  // Returns 404 if the dataset doesn't exist, and 400 if the example has no target values or a
  // field has the wrong format.
  rpc CreateExample(CreateExampleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/datasets/{dataset_name}/examples"
      body: "*"
    };
  }

  // [NOT IMPLEMENTED] Add or update an example.
  //
  // Returns 501. Add examples with POST /v2/datasets/{datasetName}/examples.
  rpc CreateOrUpdateExample(CreateOrUpdateExampleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/v2/datasets/{dataset_name}/examples/{example.id}"
      body: "*"
    };
  }

  // Add several examples to a dataset.
  //
  // Works like POST /v2/datasets/{datasetName}/examples for each example, and schedules one
  // training. Returns 400 if the list of examples is empty.
  rpc BatchCreateExample(BatchCreateExampleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/datasets/{dataset_name}/examples:batchCreate"
      body: "*"
    };
  }

  // Remove a dataset's examples, but keep its models.
  //
  // Future trainings only use examples added after this call, and the existing models stay
  // available for suggestions. Returns 404 if the dataset doesn't exist.
  rpc TruncateDataset(TruncateDatasetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/datasets/{dataset_name}/examples"};
  }

  // List a dataset's trainings.
  //
  // Returns the most recent trainings, newest first. Set how many with options.limit, from 1 to
  // 100. The default is 10. Returns 404 if the dataset doesn't exist.
  rpc GetDatasetTrainings(GetDatasetTrainingsRequest) returns (TrainingsResponse) {
    option (google.api.http) = {get: "/v2/datasets/{dataset_name}/trainings"};
  }

  // List a dataset's models.
  //
  // Returns the most recent models, newest first. Set how many with options.limit, from 1 to
  // 100. The default is 10. Returns 404 if the dataset doesn't exist.
  rpc GetDatasetModels(GetDatasetModelsRequest) returns (ModelsResponse) {
    option (google.api.http) = {get: "/v2/datasets/{dataset_name}/models"};
  }

  // List the trainings of all your datasets.
  //
  // Returns the most recent trainings across your datasets, newest first, each with its
  // dataset. Set how many with options.limit, from 1 to 100. The default is 10.
  rpc GetTrainings(GetTrainingsRequest) returns (TrainingsResponse) {
    option (google.api.http) = {get: "/v2/trainings"};
  }
}

// Request for GET /v2/datasets/{datasetName}.
message GetDatasetRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
}

// Request body for POST /v2/datasets.
message CreateDatasetRequest {
  // Name of the new dataset. Use letters, digits, ".", "_", ">" and "-", starting with a
  // letter, digit or ".", up to 256 bytes.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  // Tags for the dataset, such as a customer ID, so you can delete all datasets with a tag
  // later with DELETE /v2/tags/{tagName}. Each tag can use letters, digits, spaces, "_", ".",
  // ">" and "-", up to 64 bytes, and tags must be unique. Only tags without spaces can be used
  // to delete datasets.
  repeated string tags = 2 [
    (validate.rules).repeated.unique = true,
    (validate.rules).repeated.items.string = {
      pattern: "^[A-Za-z0-9\\s_.>-]*$"
      max_bytes: 64
    }
  ];
  asgt.type.RetentionPolicy retention_policy = 3;
}

// Request for PUT /v2/datasets/{datasetName}, which isn't implemented.
message CreateOrUpdateDatasetRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
}

// Request for DELETE /v2/datasets/{datasetName}.
message DeleteDatasetRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
}

// Request for DELETE /v2/tags/{tagName}.
message DeleteTagRequest {
  // The tag. It must use letters, digits, ".", "_", ">" and "-", starting with a letter, digit
  // or ".", up to 256 bytes, so tags with spaces can't be used here.
  string tag_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
}

// Request body for POST /v2/datasets/{datasetName}/examples.
message CreateExampleRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  asgt.v2.type.Example example = 2;
}

// Request for PUT /v2/datasets/{datasetName}/examples/{example.id}, which isn't implemented.
message CreateOrUpdateExampleRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  asgt.v2.type.Example example = 2;
}

// Request body for POST /v2/datasets/{datasetName}/examples:batchCreate.
message BatchCreateExampleRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  // The examples to add. At least one is required.
  repeated asgt.v2.type.Example examples = 2;
}

// Request for DELETE /v2/datasets/{datasetName}/examples.
message TruncateDatasetRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
}

// Options for listing trainings.
message TrainingRequestOptions {
  // Number of trainings to return, from 1 to 100. The default is 10.
  int64 limit = 1 [(validate.rules).int64 = {
    gt: 0
    lte: 100
  }];
}

// Options for listing models.
message ModelRequestOptions {
  // Number of models to return, from 1 to 100. The default is 10.
  int64 limit = 1 [(validate.rules).int64 = {
    gt: 0
    lte: 100
  }];
}

// Request for GET /v2/datasets/{datasetName}/trainings.
message GetDatasetTrainingsRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  // Listing options, sent as query parameters such as options.limit.
  TrainingRequestOptions options = 2;
}

// Request for GET /v2/datasets/{datasetName}/models.
message GetDatasetModelsRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  // Listing options, sent as query parameters such as options.limit.
  ModelRequestOptions options = 2;
}

// Request for GET /v2/trainings.
message GetTrainingsRequest {
  // Listing options, sent as query parameters such as options.limit.
  TrainingRequestOptions options = 1;
}

// A list of trainings.
message TrainingsResponse {
  // The trainings, newest first.
  repeated asgt.v2.type.Training trainings = 1;
}

// A list of models.
message ModelsResponse {
  // The models, newest first.
  repeated asgt.v2.type.Model models = 1;
}
