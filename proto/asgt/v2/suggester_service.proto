syntax = "proto3";

package asgt.v2;

import "asgt/type/model.proto";
import "asgt/type/model_type.proto";
import "asgt/type/prediction.proto";
import "asgt/type/tier.proto";
import "asgt/v2/product_service.proto";
import "asgt/v2/type/data.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/v2";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Autosuggest"
    version: "v2"
    description:
      "Autosuggest is the process automation toolkit for ERPs, designed for transaction workflows. "
      "Upload examples to a dataset, and Autosuggest trains models that suggest target values for new inputs.\n\n"
      "**Hosts:** `api.prod.asgt.visma.ai` for production and `api.stag.asgt.visma.ai` for staging.\n\n"
      "**Authentication:** send your project token as `Authorization: Bearer <token>`. "
      "See [Authentication](https://docs.vml.visma.ai/authentication/).\n\n"
      "**Errors:** a failed call returns an HTTP error status with a JSON body that holds `code`, `message` and `details`.\n\n"
      "**Guides:** [Autosuggest v2](https://docs.vml.visma.ai/autosuggest-v2/getting-started/) and "
      "[limits and rate limits](https://docs.vml.visma.ai/rate-limit/)."
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Your project token, sent as `Bearer <token>`."
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

service SuggesterService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Get suggestions from the model trained on a dataset."};

  // Suggest target values for one input.
  //
  // Uses the dataset's current model. Each target returns up to suggestLimit candidates,
  // highest confidence first, each with its confidence level.
  // Returns 404 if the dataset has no trained model yet or doesn't exist, and 400 if the input
  // sets no data structure or an option has an invalid value.
  rpc Suggest(SuggestRequest) returns (SuggestResponse) {
    option (google.api.http) = {
      post: "/v2/datasets/{dataset_name}:suggest"
      body: "*"
    };
  }

  // Suggest target values for several inputs.
  //
  // Works like POST /v2/datasets/{datasetName}:suggest, with one prediction per input, in the
  // same order. If the dataset has no trained model yet or doesn't exist, it returns 200 with no
  // predictions instead of 404. To get a 404 in that case, use
  // POST /v2/datasets/{datasetName}/model:batchSuggest.
  rpc BatchSuggest(BatchSuggestRequest) returns (BatchSuggestResponse) {
    option (google.api.http) = {
      post: "/v2/datasets/{dataset_name}:batchSuggest"
      body: "*"
    };
  }

  // Suggest target values for several inputs, or 404 without a model.
  //
  // Works like POST /v2/datasets/{datasetName}:batchSuggest, but returns 404 if the dataset has
  // no trained model yet or doesn't exist.
  rpc ModelBatchSuggest(BatchSuggestRequest) returns (BatchSuggestResponse) {
    option (google.api.http) = {
      post: "/v2/datasets/{dataset_name}/model:batchSuggest"
      body: "*"
    };
  }
}

// Options for the suggest endpoints. All of them are optional.
message SuggestOptions {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {example: "{\"suggestLimit\": 3}"};

  // Maximum number of candidates per target. The default is 10.
  int32 suggest_limit = 1;
  // The confidence level you need. Candidates below it aren't removed, so filter on each
  // candidate's confidence.level yourself. When a target's best candidate is below this level,
  // the service tries to find a better answer and uses it if it reaches the level. The default
  // is HIGH. ULTRA_HIGH isn't accepted.
  asgt.type.Confidence.Level min_confidence = 2 [(validate.rules).enum = {
    defined_only: true
    not_in: [6]
  }];
  // [NOT IMPLEMENTED] Ignored: suggestions always come from the dataset's current model. If you
  // set it, it must be DEFAULT, TENSORFLOW or ONNX.
  asgt.type.ModelType model_type = 3 [(validate.rules).enum.defined_only = true];
  // When true, the response also has product type candidates for the text of each input. The
  // default is false.
  bool include_product_types = 4;
  asgt.type.Tier tier = 5 [(validate.rules).enum.defined_only = true];
}

// Request body for POST /v2/datasets/{datasetName}:suggest.
message SuggestRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  asgt.v2.type.Data input = 2;
  SuggestOptions options = 3;
}

// Suggestions for one input.
message SuggestResponse {
  asgt.type.Prediction prediction = 1;
  // The model that made the prediction. Only its version is filled in.
  asgt.type.Model model = 2;
  // Product type candidates for the input's text, when includeProductTypes is true.
  ProductTypeSuggestion product_type_suggestions = 3;
}

// Request body for POST /v2/datasets/{datasetName}:batchSuggest and
// POST /v2/datasets/{datasetName}/model:batchSuggest.
message BatchSuggestRequest {
  // Name of the dataset.
  string dataset_name = 1 [(validate.rules).string = {
    pattern: "^[A-Za-z0-9.][A-Za-z0-9_.>-]*$"
    max_bytes: 256
  }];
  // The inputs to get suggestions for. Each one must set a data structure.
  repeated asgt.v2.type.Data inputs = 2;
  SuggestOptions options = 3;
}

// Suggestions for several inputs.
message BatchSuggestResponse {
  // One prediction per input, in the same order.
  repeated asgt.type.Prediction predictions = 1;
  // The model that made the predictions. Only its version is filled in, and it's empty when the
  // dataset has no model.
  asgt.type.Model model = 2;
  // Product type candidates for each input's text, in the same order, when includeProductTypes
  // is true.
  repeated ProductTypeSuggestion product_type_suggestions = 3;
}
