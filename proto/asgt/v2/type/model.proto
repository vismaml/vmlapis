syntax = "proto3";

package asgt.v2.type;

import "asgt/type/dataset.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/v2/type;asgttype";

message Model {
  // Creation time of the model
  google.protobuf.Timestamp created_at = 1;
  // Specifies dataset the model belongs to.
  asgt.type.Dataset dataset = 2;
  // Targets the model was trained on
  repeated string targets = 3;
  // Model version (creation time in Unix nanoseconds).
  int64 version = 4;
  // Number of examples available when the model was trained.
  int32 dataset_size = 5;
  // Number of examples used for training.
  int32 training_size = 6;
  // Number of examples used for validation.
  int32 validation_size = 7;
}
