message CreateDocumentRequest {
  Document document = 1;
}

message CreateDocumentResponse {
  string id = 1;
}

message ReadDocumentRequest {
  string id = 1;
}

message ReadDocumentResponse {
  Document document = 1;
}

message Returned {
  string field = 1;
  string confidence_level = 2;
}

message PrepareFeedbackRequest {
  string id = 1;
  ssn.type.TextAnnotation ta = 2;
  bytes document_bytes = 3;
  PredictionValues predictions = 4;
  repeated string tags = 5;
  PredictionConfidences confidences = 6;
  PredictionMetadata prediction_metadata = 7;
  ssn.type.Tier tier = 8;
  repeated string segments = 9;
  repeated string requested_features = 10;
  repeated Returned returned = 11;
}

// Feedback for one annotated document.
message FeedbackRequest {
  // The `feedbackId` from the annotate response for the document. Required.
  string id = 1;
  TrueValues true_values = 2;
  // Labels to store with the feedback, for example your customer's ID. To
  // delete the feedback later, call POST /v1/feedback:delete with one of
  // them. Tags sent with the annotate request aren't copied to the feedback.
  repeated string tags = 3;
}

message MetricsRequest {
  int64 start_time = 2;
  int64 end_time = 3;
  repeated string fields = 4;
  repeated string tags = 5;
  repeated string country_codes = 6;
  repeated string document_types = 7;
}

message FeedbackMetrics {
  int32 document_count = 1;
  int32 feedback_count = 2;
  Correctness overall_correctness = 3;
  repeated Correctness field_correctness = 4;
}

message Correctness {
  string field = 1;
  float correct_percentage = 2;
  float incomplete_percentage = 3;
  float error_percentage = 4;
  int32 support = 5;
}

// Tags of the feedback to delete.
message DeleteRequest {
  // Feedback with at least one of these tags is deleted. At least one tag is
  // required.
  repeated string tags = 1;
}

message CallsPerMonth {
  int64 calls = 1;
  string month_name = 2;
  int64 total_batch_size = 3;
  int32 year = 4;
}

message CallsPerMonthResponse {
  repeated CallsPerMonth calls_per_month = 1;
}

message AnnotationProcessMetricsRequest {
  repeated string fields = 1;
  repeated string country_codes = 2;
  repeated string document_types = 3;
  int32 most_recent_count = 4;
}

message AnnotationProcessMetricsResponse {
  int32 document_count = 1;
  int32 true_value_count = 2;
  repeated Correctness overall_correctness = 3;
  repeated Correctness field_correctness = 4;
}

message FeedbackMetricsV2Response {
  int32 document_count = 1;
  int32 feedback_count = 2;
  repeated Correctness overall_correctness = 3;
  repeated Correctness field_correctness = 4;
}
