syntax = "proto3";

package ssn.type;

import "ssn/type/geometry.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/ssn/type;ssntype";

// The OCR output for a document: its text, and its structure from pages down to single
// symbols (TextAnnotation, Page, Block, Paragraph, Word, Symbol). Each element from Page
// down can have properties, such as the detected languages and breaks.
message TextAnnotation {
  // Detected language for a structural component.
  message DetectedLanguage {
    // The BCP-47 language code, such as "en-US" or "sr-Latn". For more
    // information, see
    // http://www.unicode.org/reports/tr35/#Unicode_locale_identifier.
    string language_code = 1;
    // Confidence of detected language. Range [0, 1].
    float confidence = 2;
  }
  // Detected start or end of a structural component.
  message DetectedBreak {
    // Enum to denote the type of break found. New line, space etc.
    enum BreakType {
      // Unknown break label type.
      UNKNOWN = 0;
      // Regular space.
      SPACE = 1;
      // Sure space (very wide).
      SURE_SPACE = 2;
      // Line-wrapping break.
      EOL_SURE_SPACE = 3;
      // End-line hyphen that is not present in text; does not co-occur with
      // `SPACE` or `LINE_BREAK`.
      HYPHEN = 4;
      // Line break that ends a paragraph.
      LINE_BREAK = 5;
    }
    // Detected break type.
    BreakType type = 1;
    // True if break prepends the element.
    bool is_prefix = 2;
  }
  // Additional information detected on the structural component.
  message TextProperty {
    // A list of detected languages together with confidence.
    repeated DetectedLanguage detected_languages = 1;
    // Detected start or end of a text segment.
    DetectedBreak detected_break = 2;
  }
  // The pages, in order.
  repeated Page pages = 1;
  // UTF-8 text detected on the pages.
  string text = 2;
}

// Detected page from OCR.
message Page {
  // Additional information detected on the page.
  TextAnnotation.TextProperty property = 1;
  // The width of the page.
  int32 width = 2;
  // The height of the page.
  int32 height = 3;
  // List of blocks of text, images etc on this page.
  repeated Block blocks = 4;
  // Confidence of the OCR results on the page. Range [0, 1].
  float confidence = 5;
}

// Logical element on the page.
message Block {
  // Type of a block (text, image etc) as identified by OCR.
  enum BlockType {
    // Unknown block type.
    UNKNOWN = 0;
    // Regular text block.
    TEXT = 1;
    // Table block.
    TABLE = 2;
    // Image block.
    PICTURE = 3;
    // Horizontal/vertical line box.
    RULER = 4;
    // Barcode block.
    BARCODE = 5;
  }
  // Additional information detected for the block.
  TextAnnotation.TextProperty property = 1;
  BoundingPoly bounding_box = 2;
  // The paragraphs in the block, if it's a text block.
  repeated Paragraph paragraphs = 3;
  // Detected block type (text, image etc) for this block.
  BlockType block_type = 4;
  // Confidence of the OCR results on the block. Range [0, 1].
  float confidence = 5;
}

// Structural unit of text representing a number of words in certain order.
message Paragraph {
  // Additional information detected for the paragraph.
  TextAnnotation.TextProperty property = 1;
  BoundingPoly bounding_box = 2;
  // List of words in this paragraph.
  repeated Word words = 3;
  // Confidence of the OCR results for the paragraph. Range [0, 1].
  float confidence = 4;
}

// A word representation.
message Word {
  // Additional information detected for the word.
  TextAnnotation.TextProperty property = 1;
  BoundingPoly bounding_box = 2;
  // List of symbols in the word.
  // The order of the symbols follows the natural reading order.
  repeated Symbol symbols = 3;
  // Confidence of the OCR results for the word. Range [0, 1].
  float confidence = 4;
}

// A single symbol representation.
message Symbol {
  // Additional information detected for the symbol.
  TextAnnotation.TextProperty property = 1;
  BoundingPoly bounding_box = 2;
  // The actual UTF-8 representation of the symbol.
  string text = 3;
  // Confidence of the OCR results for the symbol. Range [0, 1].
  float confidence = 4;
}
