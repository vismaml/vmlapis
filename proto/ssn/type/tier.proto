syntax = "proto3";

package ssn.type;

option go_package = "github.com/e-conomic/vmlapis/gen/go/ssn/type;ssntype";

enum Tier {
  // Use the default tier. Defaults to the STANDARD option or account default, if set.
  DEFAULT = 0;
  STANDARD = 1;
  PREMIUM = 2;
  ULTRA = 3;
  // Runs the ULTRA pipeline, then sends the document for human verification when
  // the document-gating model says a human can supply what the AI did not.
  // Priced separately: unlike the tiers above it can incur external human
  // annotation cost.
  HUMAN = 4;
}
