syntax = "proto3";

package ssn.type;

import "ssn/type/candidate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/ssn/type;ssntype";

// Check-in and check-out dates on a document related to accommodation, returned for the
// HOTEL_DATES feature.
message HotelDates {
  // Candidates for the check-in date, as YYYY-MM-DD, for example "2019-12-31".
  repeated Candidate check_in_date = 1;

  // Candidates for the check-out date, as YYYY-MM-DD, for example "2019-12-31".
  repeated Candidate check_out_date = 2;
}
