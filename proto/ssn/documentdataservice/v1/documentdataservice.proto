syntax = "proto3";

package ssn.documentdataservice.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "ssn/type/address.proto";
import "ssn/type/candidate.proto";
import "ssn/type/qr.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/ssn/documentdataservice/v1;documentdataservice";

// ---- Source provenance ----

// CandidateSource identifies the origin of a candidate value.
// Predictions, feedback, and labels are unified — the source field
// distinguishes them. Multiple candidates for the same feature from
// different sources coexist as separate entries.
enum CandidateSource {
  CANDIDATE_SOURCE_UNSPECIFIED = 0;
  CANDIDATE_SOURCE_PREDICTION = 1;
  CANDIDATE_SOURCE_FEEDBACK = 2;
  CANDIDATE_SOURCE_LABEL = 3;
}

// ---- Unified annotation entry ----

// InternalEntry is a single annotation entry — one stored row. Provenance
// (source, source_id, created_at) is carried once, and the payload oneof holds
// the value, whose type is determined by the parent feature. The old per-type
// wrappers (InternalCandidate, InternalPurchaseLine, …) collapse into this one
// message.
message InternalEntry {
  CandidateSource source = 1;
  // model_id for PREDICTION; annotator id for LABEL/FEEDBACK.
  string source_id = 2;
  // Server-set write time of this entry's stored version (commit timestamp).
  google.protobuf.Timestamp created_at = 3;
  // Server-assigned 0-based ordinal within a (source, source_id) group,
  // numbered by entry order: TOPK rank for simple fields, line/entry order for
  // multi-entry features. Both identifies and orders the entry. Ignored on
  // write (assigned from entry order), populated on read.
  int64 candidate_id = 4;

  // The annotated value. Which field is set follows from the feature:
  //   candidate       — standard fields (TOTAL_INCL_VAT, CURRENCY, …)
  //   line            — PURCHASE_LINES
  //   distribution    — VAT_DISTRIBUTION
  //   qr_code_data /
  //   swiss_qr_bill   — QR_CODES
  //   answer          — QA
  //   address         — STRUCTURED_SUPPLIER_ADDRESS / STRUCTURED_RECEIVER_ADDRESS
  oneof payload {
    ssn.type.Candidate candidate = 5;
    ssn.type.PurchaseLine line = 6;
    ssn.type.VatDistribution distribution = 7;
    ssn.type.QrCodeData qr_code_data = 8;
    ssn.type.SwissQrBill swiss_qr_bill = 9;
    ssn.type.AnswerCandidate answer = 10;
    ssn.type.StructuredAddress address = 11;
  }
}

// ---- Unified field annotation ----

// InternalFieldAnnotation groups all entries for a single feature.
message InternalFieldAnnotation {
  // Field numbers 2-7 previously held the per-type `oneof data` wrappers
  // (field_data, purchase_line_data, …) that InternalEntry replaces.
  reserved 2, 3, 4, 5, 6, 7;
  reserved "field_data", "purchase_line_data", "vat_distribution_data", "qr_data", "answer_data", "address_data";

  // Feature name, e.g. "TOTAL_INCL_VAT", "PURCHASE_LINES", "QA", "CHECK_IN_DATE"
  string feature = 1;
  // All stored entries for this feature, across provenances and TOPK.
  repeated InternalEntry entries = 8;
}

// ---- Service ----

service DocumentDataService {
  // GetDocumentData returns document blobs (as signed GCS URLs) and field
  // annotations for a given document. Large blobs (file, renders, TextAnnotation)
  // are returned as signed GCS URLs — never inline bytes.
  rpc GetDocumentData(GetDocumentDataRequest) returns (GetDocumentDataResponse) {
    option (google.api.http) = {get: "/v1/consumers/{consumer}/documents/{feedback_id}"};
  }

  // SetDocumentBlobs upserts GCS URIs for the document's blobs.
  // Presence-based: only fields present in the request are written.
  // Absent optional fields leave existing values untouched.
  rpc SetDocumentBlobs(SetDocumentBlobsRequest) returns (SetDocumentBlobsResponse) {
    option (google.api.http) = {
      put: "/v1/consumers/{consumer}/documents/{feedback_id}/blobs"
      body: "*"
    };
  }

  // AddAnnotations upserts field annotations by (feature, source, source_id).
  // Latest-wins: a second call with the same key replaces the previous entry.
  // To preserve history, use a distinct source_id (e.g. append a version suffix).
  rpc AddAnnotations(AddAnnotationsRequest) returns (AddAnnotationsResponse) {
    option (google.api.http) = {
      post: "/v1/consumers/{consumer}/documents/{feedback_id}/annotations"
      body: "*"
    };
  }

  // DeleteDocument schedules asynchronous deletion of a document and all its
  // blobs and annotations. Deletion is durable (Pub/Sub) and retried on failure.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (google.api.http) = {delete: "/v1/consumers/{consumer}/documents/{feedback_id}"};
  }

  // DeleteAnnotations removes annotations for a specific feature, optionally
  // narrowed by source and source_id. Cleans up the field_annotation marker
  // if no annotations remain for the feature.
  rpc DeleteAnnotations(DeleteAnnotationsRequest) returns (DeleteAnnotationsResponse) {
    option (google.api.http) = {delete: "/v1/consumers/{consumer}/documents/{feedback_id}/annotations"};
  }
}

// ---- Request / Response messages ----

message GetDocumentDataRequest {
  string feedback_id = 1;
  string consumer = 2;
  bool include_predictions = 3;
  bool include_feedbacks = 4;
  bool include_labels = 5;
  // Target environment: "snbx", "stag", "prod".
  string environment = 6;
}

message GetDocumentDataResponse {
  string feedback_id = 1;
  string consumer = 2;

  // Authorized GCS URLs (signed, with expiration).
  string file_url = 3;
  // One per page in order. Empty = not rendered yet.
  repeated string render_urls = 4;
  // Absent = TextAnnotation not stored.
  google.protobuf.StringValue text_annotation_url = 5;

  // Field annotations filtered by include_* flags.
  repeated InternalFieldAnnotation fields = 6;

  // When this document expires and will be garbage-collected.
  google.protobuf.Timestamp expires_at = 7;

  // Features the customer originally requested for this document.
  repeated string requested_features = 8;

  // When this document was last modified (server-managed, commit timestamp).
  google.protobuf.Timestamp updated_at = 9;

  // Document-level tags (e.g. transaction tags from asyncton).
  repeated string tags = 10;
}

message SetDocumentBlobsRequest {
  string feedback_id = 1;
  string consumer = 2;
  // Set → write; absent → leave untouched.
  google.protobuf.StringValue file_uri = 3;
  // Non-empty → write; empty → leave untouched.
  repeated string render_uris = 4;
  // Set → write; absent → leave untouched.
  google.protobuf.StringValue ta_uri = 5;
  // Set → write; absent → leave untouched.
  google.protobuf.Timestamp expires_at = 6;
  // Target environment: "snbx", "stag", "prod".
  string environment = 7;
  // Non-empty → write; empty → leave untouched.
  repeated string requested_features = 8;
  // Non-empty → write; empty → leave untouched.
  repeated string tags = 9;
  // Raw document bytes. If set, DDS uploads to GCS and derives file_uri.
  // Takes precedence over file_uri when both are provided.
  bytes content = 10;
  // Text annotation bytes. If set, DDS uploads to GCS and derives ta_uri.
  // Takes precedence over ta_uri when both are provided.
  bytes ta_content = 11;
  // Rendered page image bytes. If set, DDS uploads to GCS and derives render_uris.
  // Takes precedence over render_uris when both are provided.
  repeated bytes render_contents = 12;
}

message SetDocumentBlobsResponse {}

message AddAnnotationsRequest {
  string feedback_id = 1;
  string consumer = 2;
  repeated InternalFieldAnnotation annotations = 3;
  // Target environment: "snbx", "stag", "prod".
  string environment = 4;
}

message AddAnnotationsResponse {}

message DeleteDocumentRequest {
  string feedback_id = 1;
  string consumer = 2;
  reserved 3;
}

message DeleteDocumentResponse {}

message DeleteAnnotationsRequest {
  string feedback_id = 1;
  string consumer = 2;
  reserved 3;
  // Required. The feature whose annotations should be deleted.
  string feature = 4;
  // Optional. If set, only delete annotations with this source.
  string source = 5;
  // Optional. If set with source, delete only the specific (source, source_id) entry.
  string source_id = 6;
}

message DeleteAnnotationsResponse {}
