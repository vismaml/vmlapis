syntax = "proto3";

package ssn.companylookup.v1;

import "ssn/type/candidate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/ssn/companylookup/v1;companylookup";

// CompanyLookupService is an internal service called during invoice
// post-processing. It records company/bank-account observations and returns
// whether the supplier VAT number has been confirmed by a registry. It never
// calls external registries — enrichment is fetched out of band by a job.
service CompanyLookupService {
  rpc ProcessInvoiceCompanyData(ProcessInvoiceCompanyDataRequest) returns (ProcessInvoiceCompanyDataResponse);

  // VerifySupplier reports whether a registry has confirmed the supplier's
  // identifier. Read-only.
  rpc VerifySupplier(VerifySupplierRequest) returns (VerifySupplierResponse);
}

// The request is flat: each field is the top-1 smartscan candidate for the
// corresponding PredictResponse field, so callers pass candidates through
// without mapping. The service records value + confidence level per field.
message ProcessInvoiceCompanyDataRequest {
  string project_name = 1;
  string transaction_id = 2;

  ssn.type.Candidate supplier_name = 3;
  ssn.type.Candidate supplier_vat_number = 4;
  ssn.type.Candidate supplier_organisation_number = 5;
  ssn.type.Candidate supplier_country_code = 6; // ISO 3166-1 alpha-2
  ssn.type.Candidate supplier_address = 7;

  ssn.type.Candidate receiver_name = 8;
  ssn.type.Candidate receiver_vat_number = 9;
  ssn.type.Candidate receiver_organisation_number = 10;
  ssn.type.Candidate receiver_country_code = 11; // ISO 3166-1 alpha-2
  ssn.type.Candidate receiver_address = 12;

  ssn.type.Candidate iban = 13;
  ssn.type.Candidate bic = 14;
  ssn.type.Candidate bank_account_number = 15;
  ssn.type.Candidate bank_registration_number = 16;

  repeated string product_types = 17;
}

message ProcessInvoiceCompanyDataResponse {
  // True only when the supplier company has been enriched and the registry
  // (VIES) confirmed the VAT number.
  bool supplier_vat_valid = 1;
}

message VerifySupplierRequest {
  string country_code = 1; // ISO 3166-1 alpha-2
  string vat_number = 2;
  string organisation_number = 3;
}

// SupplierVerdictReason explains the verdict. Only VERIFIED_BY_REGISTRY is
// definitive; every other value means "no confirmation" and must never be
// rendered to a customer as a negative claim about the supplier.
enum SupplierVerdictReason {
  SUPPLIER_VERDICT_REASON_UNSPECIFIED = 0;
  // A registry positively confirmed the identifier.
  VERIFIED_BY_REGISTRY = 1;
  // A registry that covers this country returned "not valid".
  REFUTED_BY_REGISTRY = 2;
  // Discovered but never looked up yet.
  NOT_ATTEMPTED = 3;
  // Looked up, and the registry call failed.
  ATTEMPT_FAILED = 4;
  // No configured registry covers this country, so absence of confirmation
  // says nothing about the supplier. Distinct from REFUTED_BY_REGISTRY: a
  // valid GB VAT number is unverifiable, not invalid.
  NO_REGISTRY_FOR_COUNTRY = 5;
  // Neither a VAT nor an organisation number was extracted.
  NO_IDENTIFIER = 6;
  // Confirmed once, but the confirmation is older than the freshness window.
  STALE = 7;
}

// VerifiedIdentifier says which identifier the verdict is about, so the caller
// knows which candidate to mark.
enum VerifiedIdentifier {
  VERIFIED_IDENTIFIER_UNSPECIFIED = 0;
  VAT_NUMBER = 1;
  ORGANISATION_NUMBER = 2;
}

message VerifySupplierResponse {
  // True only for VERIFIED_BY_REGISTRY. False means "no confirmation", never
  // "refuted" — read reason to tell the cases apart.
  bool verified = 1;
  SupplierVerdictReason reason = 2;
  VerifiedIdentifier identifier = 3;
}
